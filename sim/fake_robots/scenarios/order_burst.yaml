# 주문 8건이 한꺼번에 오고 처리 중에 2건이 더 온다. 주문이 밀려 있으면 출고 구역을 떠난 로봇은
# 대기 루프를 거치지 않고 곧장 작업대로 가야 한다.
# direct_returns_min은 그런 바퀴를, parked_while_backlog는 반대 경우를 센다.
# 첫 3건은 대기 칸에서 오는 로봇이 받는다. 마지막 2건이 배정될 때까지 주문이 계속 밀려 있으므로
# 나머지 7건은 모두 곧장 돌아온 바퀴에서 나와야 한다.
seed: 11
speed_factor: 5.0
timeout_s: 1200
stock: {arm1: {A: 12, B: 12}, arm2: {C: 12, D: 12}}
orders:
  - {at_s: 0, id: O-001, items: {A: 1, C: 1}}
  - {at_s: 0, id: O-002, items: {B: 1, D: 1}}
  - {at_s: 0, id: O-003, items: {A: 2}}
  - {at_s: 0, id: O-004, items: {C: 2}}
  - {at_s: 0, id: O-005, items: {A: 1, B: 1, C: 1, D: 1}}
  - {at_s: 0, id: O-006, items: {D: 1}}
  - {at_s: 0, id: O-007, items: {B: 2, D: 1}}
  - {at_s: 0, id: O-008, items: {A: 1}}
  - {at_s: 120, id: O-009, items: {C: 1, B: 1}}
  - {at_s: 120, id: O-010, items: {D: 2}}
robots:
  pinky1: {start: P-6, speed_mps: 0.20, pose_noise_m: 0.03}
  pinky2: {start: P-5, speed_mps: 0.18, pose_noise_m: 0.03}
  pinky3: {start: P-4, speed_mps: 0.20, pose_noise_m: 0.03}
arm: {seconds_per_item: 4.0, swap_seconds: 8.0, fail_rate: 0.0}
dock: {duration_s: 3.0, error_cm: 1.0}
faults: []
expect:
  all_orders_finished: true
  orders_shipped: 10
  orders_partial: 0
  orders_held: 0
  fifo_violations: 0
  dual_arm_overlaps: 0
  zone_holder_max: 1
  released_without_position_check: 0
  unheld_zone_pose: 0
  direct_returns_min: 7
  parked_while_backlog: 0
  events_include: [ORDER_BOUND, ORDER_SHIPPED]
  event_counts: {ORDER_BOUND: 10, COMM_LOST: 0, GOAL_RETRY: 0, ZONE_WAIT_LONG: 0, ROBOT_NOT_REPORTING: 0}
  order_results: {O-001: SHIPPED, O-002: SHIPPED, O-003: SHIPPED, O-004: SHIPPED, O-005: SHIPPED,
                  O-006: SHIPPED, O-007: SHIPPED, O-008: SHIPPED, O-009: SHIPPED, O-010: SHIPPED}

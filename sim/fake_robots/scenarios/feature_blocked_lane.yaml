# 특징 지도(지시서 5번)의 레인 막힘: blocked_lane과 같고 지도, 출발 칸, 물체 시각이 다르다.
# 물체는 46초부터 30초. pinky1이 서쪽행 레인(F1->F2 근처)에서 막히면 pinky3이 좁은 통로로
# 돌아간다(DETOUR). 대개 막힌 레인 뒤 F1에서 기다리는 pinky2를 피하고, 가끔 막힌 레인 자체를 피한다.
# 11-06 실행 6번 모두 한 번씩 났다. 시각은 ROS 없는 SimWorld로 골랐다.
map: feature_map
seed: 7
speed_factor: 5.0
timeout_s: 900
stock: {arm1: {A: 6, B: 6}, arm2: {C: 6, D: 6}}
orders:
  - {at_s: 0, id: O-001, items: {A: 1, C: 1}}
  - {at_s: 0, id: O-002, items: {B: 1, D: 1}}
  - {at_s: 10, id: O-003, items: {A: 2}}
  - {at_s: 20, id: O-004, items: {C: 1, D: 1, A: 1}}
  - {at_s: 40, id: O-005, items: {B: 2, C: 2}}
  - {at_s: 60, id: O-006, items: {D: 1}}
robots:
  pinky1: {start: P-3, speed_mps: 0.20, pose_noise_m: 0.03}
  pinky2: {start: P-2, speed_mps: 0.18, pose_noise_m: 0.03}
  pinky3: {start: P-1, speed_mps: 0.20, pose_noise_m: 0.03, localizing_s: 2.0}
arm: {seconds_per_item: 4.0, swap_seconds: 8.0, fail_rate: 0.0}
dock: {duration_s: 3.0, error_cm: 1.0}
faults:
  - {at_s: 46.0, robot: pinky1, type: blocked, duration_s: 30.0}
expect:
  robot_idle: null  # 고장 시나리오는 ROBOT_IDLE을 세지 않는다(1.1 지시서 H2)
  all_orders_finished: true
  orders_shipped: 6
  orders_partial: 0
  orders_held: 0
  fifo_violations: 0
  dual_arm_overlaps: 0
  zone_holder_max: 1
  released_without_position_check: 0
  unheld_zone_pose: 0
  events_include: [ORDER_BOUND, ORDER_SHIPPED, DOCKED, LANE_BLOCKED, LANE_CLEARED, DETOUR]
  event_counts: {ORDER_BOUND: 6, LANE_BLOCKED: 1, LANE_CLEARED: 1, BLOCKED_TOO_LONG: 0, COMM_LOST: 0, GOAL_RETRY: 0, GOAL_STALLED: 0, GOAL_FAILED: 0, ROBOT_NOT_REPORTING: 0}
  order_results: {O-001: SHIPPED, O-002: SHIPPED, O-003: SHIPPED, O-004: SHIPPED, O-005: SHIPPED, O-006: SHIPPED}

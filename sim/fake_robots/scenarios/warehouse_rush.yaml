# 창고 지도(warehouse) 부하 시나리오. 주문 36건이 15~25초마다 와서 늘 밀려 있다.
# 로봇 3대는 대기 칸에서 출발해 서쪽 끝 WORK와 동쪽 끝 OUTBOUND를 오가며 서로 엇갈린다.
# 고장은 없다. Gazebo에서도 같은 파일을 쓴다(Gazebo는 speed_factor를 무시한다).

# 2차선 대로 상자(버전 2 1-C): basic_orders와 같은 주문을 넓힌 2차선 대로 지도에서 돌리고, 동쪽행 차선
# AE->BE 위에 상자 하나를 둔다. 관제는 상자를 모른다(지도에 없다). 막힌 로봇은 obstacle_wait_s 뒤
# 로봇 planner(가짜 경로 계산)에 비켜 갈 길을 받고, 서쪽행 차선 구역을 한꺼번에 빌려 지나간다.
# 서쪽행 차선에 다른 로봇이 있거나 기다리면 빈 뒤에 빌린다(모두 비고 기다리는 로봇이 없을 때만).
# path 모드 전용이다. point 목표는 가짜 로봇이 곧게 가서 상자를 비켜 갈 길이 없다.
# 판정(judge)은 아직 이 시나리오를 따로 보지 않는다. ROS 시나리오 시험 목록에는 넣지 않았다.
map: two_lane_avenue_wide
seed: 7
speed_factor: 5.0
timeout_s: 900
stock: {arm1: {A: 6, B: 6}, arm2: {C: 6, D: 6}}
orders:
  - {at_s: 0, id: O-001, items: {A: 1, C: 1}}
  - {at_s: 0, id: O-002, items: {B: 1, D: 1}}
  - {at_s: 10, id: O-003, items: {A: 2}}
  - {at_s: 20, id: O-004, items: {C: 1, D: 1, A: 1}}
  - {at_s: 40, id: O-005, items: {B: 2, C: 2}}
  - {at_s: 60, id: O-006, items: {D: 1}}
robots:
  pinky1: {start: P-6, speed_mps: 0.20, pose_noise_m: 0.03}
  pinky2: {start: P-5, speed_mps: 0.18, pose_noise_m: 0.03}
  pinky3: {start: P-4, speed_mps: 0.20, pose_noise_m: 0.03}
arm: {seconds_per_item: 4.0, swap_seconds: 8.0, fail_rate: 0.0}
dock: {duration_s: 3.0, error_cm: 1.0}
faults: []
boxes:
  - {x: 1.75, y: 1.30, size_m: 0.08}
expect:
  all_orders_finished: true
  orders_shipped: 6
  orders_partial: 0
  orders_held: 0
  fifo_violations: 0
  dual_arm_overlaps: 0
  released_without_position_check: 0
  events_include: [ORDER_BOUND, ORDER_SHIPPED, DOCKED, DETOUR_PLANNED, ZONE_BORROWED, DETOUR_DONE]
  order_results: {O-001: SHIPPED, O-002: SHIPPED, O-003: SHIPPED, O-004: SHIPPED, O-005: SHIPPED, O-006: SHIPPED}

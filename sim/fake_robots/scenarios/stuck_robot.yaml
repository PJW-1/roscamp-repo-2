# pinky1이 O-001을 출고하고 돌아오던 66초에 AVENUE 위에서 영영 멈추고 응답이 끊긴다.
# 스테이션 사이 이동은 모두 AVENUE가 필요해 나머지가 뒤에 막힌다.
# pinky2는 이미 OUTBOUND에 도킹해 O-002를 출고한 뒤, 빈 바구니로 도크에서 AVENUE를 기다린다.
# pinky3은 O-003을 쥔 채 채움 도크에서 AVENUE를 기다려 찬 바구니가 나가지 못한다.
# 더는 출고할 수 없다: 출고 2건, 로봇에 걸린 것 1건, 미배정 3건.
# 플릿 매니저는 경고(pinky1은 COMM_LOST, 뒤의 둘은 ZONE_WAIT_LONG)를 내고 구역을 계속 쥐어야 한다.
seed: 5
speed_factor: 5.0
timeout_s: 400
stock: {arm1: {A: 6, B: 6}, arm2: {C: 6, D: 6}}
orders:
  - {at_s: 0, id: O-001, items: {A: 1, C: 1}}
  - {at_s: 0, id: O-002, items: {B: 1, D: 1}}
  - {at_s: 10, id: O-003, items: {A: 2}}
  - {at_s: 20, id: O-004, items: {C: 1, D: 1, A: 1}}
  - {at_s: 40, id: O-005, items: {B: 2, C: 2}}
  - {at_s: 60, id: O-006, items: {D: 1}}
robots:
  pinky1: {start: P-6, speed_mps: 0.20, pose_noise_m: 0.03}
  pinky2: {start: P-5, speed_mps: 0.18, pose_noise_m: 0.03}
  pinky3: {start: P-4, speed_mps: 0.20, pose_noise_m: 0.03}
arm: {seconds_per_item: 4.0, swap_seconds: 8.0, fail_rate: 0.0}
dock: {duration_s: 3.0, error_cm: 1.0}
faults:
  - {at_s: 66, robot: pinky1, type: stuck}
expect:
  robot_idle: null  # 고장 시나리오는 ROBOT_IDLE을 세지 않는다(1.1 지시서 H2)
  all_orders_finished: false
  orders_shipped: 2
  orders_partial: 0
  orders_held: 0
  fifo_violations: 0
  dual_arm_overlaps: 0
  zone_holder_max: 1
  released_without_position_check: 0
  unheld_zone_pose: 0
  events_include: [COMM_LOST, ZONE_WAIT_LONG]
  event_counts: {COMM_LOST: 1, ZONE_WAIT_LONG: 2, ROBOT_NOT_REPORTING: 0}
  timed_out: true
  order_results: {O-001: SHIPPED, O-002: SHIPPED}

# Gazebo 3대 연속 운행: 주문 18건이 10초마다 들어와 늘 밀려 있다(3대가 한 건에 40초쯤 걸린다).
# 로봇은 일을 끝내자마자 다음 주문을 받아 대기 칸에 쉬지 않고 작업대(W) -> 출고(O)를 계속 돈다.
# 도킹은 sim_dock_stub:=true가 있어야 끝까지 돈다. 장애물은 obstacles 인자로 따로 준다.
# Gazebo 시계를 쓰므로 speed_factor는 쓰이지 않는다(fake 세계에서 돌릴 때만 쓰인다).
seed: 31
speed_factor: 5.0
timeout_s: 1500
stock: {arm1: {A: 20, B: 20}, arm2: {C: 20, D: 20}}
orders:
  - {at_s: 0, id: N-001, items: {A: 1, C: 1}}
  - {at_s: 10, id: N-002, items: {B: 1}}
  - {at_s: 20, id: N-003, items: {D: 1, A: 1}}
  - {at_s: 30, id: N-004, items: {C: 1}}
  - {at_s: 40, id: N-005, items: {B: 1, D: 1}}
  - {at_s: 50, id: N-006, items: {A: 1}}
  - {at_s: 60, id: N-007, items: {C: 1, B: 1}}
  - {at_s: 70, id: N-008, items: {D: 1}}
  - {at_s: 80, id: N-009, items: {A: 1, C: 1}}
  - {at_s: 90, id: N-010, items: {B: 1}}
  - {at_s: 100, id: N-011, items: {D: 1, A: 1}}
  - {at_s: 110, id: N-012, items: {C: 1}}
  - {at_s: 120, id: N-013, items: {B: 1, D: 1}}
  - {at_s: 130, id: N-014, items: {A: 1}}
  - {at_s: 140, id: N-015, items: {C: 1, B: 1}}
  - {at_s: 150, id: N-016, items: {D: 1}}
  - {at_s: 160, id: N-017, items: {A: 1, C: 1}}
  - {at_s: 170, id: N-018, items: {B: 1}}
robots:
  pinky1: {start: P-6}
  pinky2: {start: P-5}
  pinky3: {start: P-4}
arm: {seconds_per_item: 4.0, swap_seconds: 8.0, fail_rate: 0.0}
dock: {duration_s: 3.0, error_cm: 1.0}
faults: []
expect:
  all_orders_finished: true
  orders_shipped: 18
  orders_partial: 0
  orders_held: 0
  # 세 로봇은 대기 칸에서 호출돼 한 건씩 받는다(0·10·20초 주문). 나머지 15건은 출고에서 곧장
  # 작업대로 온 바퀴다: 주문이 밀린 동안 주차는 위반이고, 170초 뒤로는 새 주문이 없어 출고 뒤
  # 호출되지 않은 로봇은 다시 묶지 않는다. 로봇 고장 같은 일이 나면 이 수는 맞지 않는다
  direct_returns_min: 15
  parked_while_backlog: 0
  events_include: [ORDER_BOUND, ORDER_SHIPPED]

# 포트폴리오용 Gazebo 창고 운행: 창고 지도(warehouse)에서 핑키 3대가 21분 동안 쉬지 않는다.
# 주문이 30초마다 하나씩(43건) 들어와 늘 밀려 있다. 로봇은 북쪽 대기 칸 P-1~P-3에서 출발해
# 서쪽 WORK(팔 arm1, arm2)와 동쪽 OUTBOUND(팔 arm3)를 오가며 가운데에서 엇갈린다.
# 팔과 도킹 시간은 짧게 잡아 로봇이 오래 서 있지 않는다. 고장은 없다.
# 도킹은 sim_dock_stub:=true로 돌린다(진짜 pinky_fsm은 DOCK_UNAVAILABLE). 장애물은
# obstacles:=warehouse. Gazebo 시계를 쓰므로 speed_factor는 쓰이지 않는다.
#   ros2 launch fleet_gz_sim gz.launch.py scenario:=gz_warehouse sim_dock_stub:=true obstacles:=warehouse

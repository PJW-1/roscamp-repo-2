# 창고 사이트 (2026-11-08). 레인 지도 sim/fake_robots/maps/warehouse.yaml의 정적 상자.
# 랙 줄 넷(y 0.6-0.9, 1.4-1.7, 2.2-2.5, 3.0-3.3)이 레인 줄 사이에 있고, 열 A, C, E, G에서 끊긴다.
# 열 D(x 3.0) 자리는 줄 0-1, 1-2 랙이 비어 있다(지점 없는 교차 D0->D2). 대기 칸 자리(x 2.55-3.45,
# y 3.0-3.3)도 비었다. 벽 따라 랙, 도크 옆 작업대와 그 위 팔, 남쪽 벽 기둥, 북쪽 모서리 소품.
# 레인에서 모두 0.25 m 이상.
lane_map: warehouse            # sim/fake_robots/maps/의 이름
bounds_m: [0.0, 0.0, 6.0, 4.0] # 벽 안쪽 면
boxes:
  # ---- 작업대: WORK(arm1, arm2)는 서쪽 벽, OUTBOUND(arm3)는 동쪽 벽 ----
